[project]
name = "tea-jovanova-projekat"
version = "0.1.0"
description = "Mobility index project"
requires-python = ">=3.12"
dependencies = [
    "et-xmlfile==2.0.0",
    "geographiclib==2.1",
    "geopy==2.4.1",
    "numpy==2.0.2",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2025.2",
    "six==1.17.0",
    "tzdata==2025.3",
    "xlsxwriter==3.2.9",
    "anfis-toolbox==0.2.1",
    "scikit-learn>=1.8.0",
    "matplotlib==3.10.8",
    "matlab>=0.1",
    "peewee>=4.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
